<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
  <title>Personal University</title>
</head>
<body>
  <form class="login" method="post" action="/login">
    <h1>Personal University</h1>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <p class="error" id="error" hidden>That password didn't work.</p>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("failed")) document.getElementById("error").hidden = false;
  </script>
</body>
</html>
